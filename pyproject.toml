[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-ingestion"
version = "0.1.0"
description = "Synthetic Clarity/Caboodle ingestion into Microsoft Fabric."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
spark = [
    "delta-spark==4.2.0",
    "pyspark==4.1.0",
]
cloud = [
    "azure-identity==1.27.0",
    "azure-monitor-ingestion==1.1.0",
    "azure-storage-blob==12.31.1",
    "pyodbc==5.5.0",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
