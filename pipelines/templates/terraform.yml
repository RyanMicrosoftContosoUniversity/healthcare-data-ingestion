parameters:
  - name: module
    type: string
    values: [bootstrap, azure, fabric]
  - name: variablesSecureFile
    type: string
    default: ''
  - name: apply
    type: boolean
    default: false
stages:
  - stage: Plan
    jobs:
      - job: ValidateAndPlan
        pool:
          vmImage: windows-2022
        timeoutInMinutes: 45
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - pwsh: .\scripts\cicd\Install-Terraform.ps1
            displayName: Install checksum-verified Terraform
          - ${{ if eq(parameters.variablesSecureFile, '') }}:
              - pwsh: |
                  throw 'Upload the reviewed deployment inputs to an ADO Secure File and select variablesSecureFile. No placeholder inputs are permitted.'
          - ${{ if ne(parameters.variablesSecureFile, '') }}:
              - task: DownloadSecureFile@1
                name: inputs
                inputs:
                  secureFile: ${{ parameters.variablesSecureFile }}
              - task: AzureCLI@2
                inputs:
                  azureSubscription: fabric-sc
                  addSpnToEnvironment: true
                  scriptType: pscore
                  scriptLocation: scriptPath
                  scriptPath: scripts\cicd\Invoke-Terraform.ps1
                  arguments: -Phase Plan -Module ${{ parameters.module }}
                env:
                  VARIABLES_FILE: $(inputs.secureFilePath)
                  PLAN_DIRECTORY: $(Pipeline.Workspace)\terraform-plan
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Pipeline.Workspace)\terraform-plan
                  artifactName: terraform-plan
  - ${{ if eq(parameters.apply, true) }}:
      - stage: Review
        dependsOn: Plan
        jobs:
          - job: ReviewActualPlan
            pool: server
            timeoutInMinutes: 1440
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 1430
                inputs:
                  notifyUsers: ''
                  approvers: '[Fabric]\Project Administrators'
                  allowApproversToApproveTheirOwnRuns: true
                  instructions: 'Review the saved terraform-plan artifact, resource/cost implications, target subscription and live prerequisites. Resume approves only this exact plan. No deletions/replacements or runtime/alert activation are permitted.'
                  onTimeout: reject
      - stage: Apply
        dependsOn: Review
        jobs:
          - job: ApplyReviewedPlan
            pool:
              vmImage: windows-2022
            timeoutInMinutes: 60
            steps:
              - checkout: self
                fetchDepth: 1
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.11'
              - pwsh: .\scripts\cicd\Install-Terraform.ps1
                displayName: Install checksum-verified Terraform
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: current
                  artifactName: terraform-plan
                  targetPath: $(Pipeline.Workspace)\terraform-plan
              - task: AzureCLI@2
                inputs:
                  azureSubscription: fabric-sc
                  addSpnToEnvironment: true
                  scriptType: pscore
                  scriptLocation: scriptPath
                  scriptPath: scripts\cicd\Invoke-Terraform.ps1
                  arguments: -Phase Apply -Module ${{ parameters.module }}
                env:
                  PLAN_DIRECTORY: $(Pipeline.Workspace)\terraform-plan
              - task: PublishPipelineArtifact@1
                condition: succeeded()
                inputs:
                  targetPath: $(Pipeline.Workspace)\terraform-plan\deployment-outputs
                  artifactName: deployment-outputs
