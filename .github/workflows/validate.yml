name: Validate scoped ingestion release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --locked --group dev --python 3.11
      - name: Test and build
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          .\scripts\Test-Project.ps1
      - name: Compile immutable local bundle
        shell: pwsh
        run: |
          $version = uv run --locked python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Version lookup failed.' }
          uv run --locked python -m healthcare_ingestion.build_artifacts `
            --release metadata\framework\demo-release.json `
            --contracts database\schema-contracts `
            --wheel "dist\healthcare_ingestion-$version-py3-none-any.whl" `
            --lock uv.lock --output "build\releases\$version"
          if ($LASTEXITCODE -ne 0) { throw 'Release compilation failed.' }

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --locked --group dev --extra spark --python 3.13
      - run: uv run --locked pytest tests/test_execution_runtime.py tests/test_spark_runtime.py

  infrastructure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.13.4'
          terraform_wrapper: false
      - name: Validate without accessing remote state or deploying
        shell: pwsh
        run: |
          terraform -chdir=infrastructure\terraform fmt -check -recursive
          if ($LASTEXITCODE -ne 0) { throw 'Terraform format failed.' }
          foreach ($module in @('infrastructure\terraform\azure', 'infrastructure\terraform\fabric', 'infrastructure\terraform\bootstrap')) {
            terraform "-chdir=$module" init -backend=false -input=false
            if ($LASTEXITCODE -ne 0) { throw 'Terraform initialization failed.' }
            terraform "-chdir=$module" validate
            if ($LASTEXITCODE -ne 0) { throw 'Terraform validation failed.' }
          }
